<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dup Me Server</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --green:#4CD97B; --red:#FF5C5C; --yellow:#FFCB3D; }
  *{box-sizing:border-box;}
  body{ margin:0; background:#151826; color:#E7EAF6; font-family:'Nunito',sans-serif; display:flex; justify-content:center; padding:24px 16px 40px; }
  .wrap{ width:100%; max-width:560px; }
  h1{ font-family:'Fredoka',sans-serif; font-size:28px; margin:0 0 4px; color:#fff; }
  .addr{ font-size:12px; color:#8F96B8; font-weight:800; margin-bottom:16px; display:flex; align-items:center; gap:6px; }
  .dot{ width:10px; height:10px; border-radius:50%; background:var(--red); }
  .card{ background:#1F2335; border:1px solid #33395A; border-radius:12px; padding:14px; margin-bottom:12px; }
  .card h3{ margin:0 0 10px; font-size:12px; letter-spacing:1px; color:#8F96B8; }
  .big{ font-size:48px; font-weight:900; color:var(--green); line-height:1; }
  .big span{ font-size:14px; color:#8F96B8; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; color:#8F96B8; font-size:10px; letter-spacing:1px; padding:4px 4px 6px; border-bottom:1px solid #33395A; }
  td{ padding:7px 4px; border-bottom:1px solid #2A2F45; font-weight:800; }
  .pill{ background:#2D3A63; color:#BFD0FF; border-radius:6px; padding:2px 6px; font-size:10px; }
  .row{ display:flex; justify-content:space-between; font-size:13px; font-weight:800; padding:4px 0; }
  .row .k{ color:#8F96B8; }
  .reset{ width:100%; background:var(--red); color:#fff; border:none; border-radius:10px; padding:14px; font-family:'Fredoka',sans-serif; font-size:17px; cursor:pointer; }
  .reset:active{ opacity:.8; }
  .match{ border-top:1px solid #33395A; padding-top:10px; margin-top:10px; }
  .match:first-child{ border-top:none; padding-top:0; margin-top:0; }
  .match-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .match-head b{ color:#fff; font-size:14px; }
  .small-reset{ background:transparent; color:var(--red); border:1px solid var(--red); border-radius:8px; padding:4px 10px; font-weight:800; font-size:11px; cursor:pointer; font-family:inherit; }
  .small-reset:active{ background:var(--red); color:#fff; }
  .log{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:#9FE3B4; line-height:1.6; max-height:220px; overflow:auto; white-space:pre-wrap; }
  .empty{ color:#6b7196; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚙️ Dup Me Server</h1>
  <div class="addr"><span class="dot" id="dot"></span><span id="addr">Connecting…</span></div>

  <div class="card">
    <h3>CLIENTS ONLINE</h3>
    <div class="big" id="count">0 <span>connected</span></div>
    <div style="margin-top:8px;font-size:13px;font-weight:800;color:#8F96B8;" id="matchCount">0 matches running</div>
  </div>

  <div class="card">
    <h3>CONNECTED CLIENTS</h3>
    <table>
      <thead><tr><th>#</th><th>NICKNAME</th><th>IP</th><th>MATCH</th><th>STATUS</th></tr></thead>
      <tbody id="clients"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>MATCHES IN PROGRESS</h3>
    <div id="match"></div>
  </div>

  <button class="reset" onclick="resetGame()">↺ Reset All Games &amp; Scores</button>

  <div class="card" style="margin-top:12px;">
    <h3>LOG</h3>
    <div class="log" id="log"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const socket = io();

socket.on("connect", () => {
  adminJoin(sessionStorage.getItem("adminPassword"));
});
function adminJoin(password){
  socket.emit("admin_join", password, (ok) => {
    if (ok){
      if (password) sessionStorage.setItem("adminPassword", password);
      $("dot").style.background = "var(--green)";
      $("addr").textContent = "Server running at " + location.host;
      return;
    }
    sessionStorage.removeItem("adminPassword");
    const next = prompt(password ? "Wrong password. Try again:" : "Admin password:");
    if (next) adminJoin(next);
    else $("addr").textContent = "Password required — reload to try again";
  });
}
socket.on("disconnect", () => { $("dot").style.background = "var(--red)"; $("addr").textContent = "Server stopped"; });

socket.on("admin_state", ({ online, matches, logs }) => {
  $("count").innerHTML = `${online.length} <span>connected</span>`;
  $("matchCount").textContent = `${matches.length} match${matches.length === 1 ? "" : "es"} running`;
  const statusOf = (c) => c.status === "ready" && c.queuePos ? `ready · #${c.queuePos} in line`
    : c.status === "break" ? "taking a break" : c.status;
  $("clients").innerHTML = online.length
    ? online.map((c, i) => `<tr><td>${i + 1}</td><td>${c.avatar} ${esc(c.name)}</td><td>${esc(c.ip)}</td><td>${c.matchId ? "#" + c.matchId : "-"}</td><td><span class="pill">${statusOf(c)}</span>${c.loggedIn ? ' <span class="pill">account</span>' : ""}</td></tr>`).join("")
    : `<tr><td colspan="5" class="empty">No clients yet</td></tr>`;

  if (matches.length === 0){
    $("match").innerHTML = `<div class="empty">Waiting for 2 ready players…</div>`;
  } else {
    $("match").innerHTML = matches.map((g) => {
      const [a, b] = g.players;
      const name = (id) => esc(g.players.find((p) => p.id === id)?.name ?? "-");
      const phase = { create: "Creating pattern", repeat: "Repeating", review: "Showing result", ended: "Match ended" }[g.phase];
      return `<div class="match">
        <div class="match-head"><b>Match #${g.id}</b><button class="small-reset" onclick="resetGame(${g.id})">↺ Reset</button></div>
        <div class="row"><span class="k">Players</span><span>${esc(a.name)} vs ${esc(b.name)}</span></div>
        <div class="row"><span class="k">Settings</span><span>${g.mode === "hard" ? "🔀 Hard" : "Normal"} · ${g.buttons} buttons${g.players.some((p) => p.isBot) ? " · 🤖 vs AI bot" : ""}</span></div>
        <div class="row"><span class="k">First player</span><span>🎲 ${name(g.firstPlayer)}</span></div>
        <div class="row"><span class="k">Round</span><span>${g.round} / 2 · ${phase}</span></div>
        <div class="row"><span class="k">Score</span><span>${esc(a.name)} ${g.scores[a.id]} – ${g.scores[b.id]} ${esc(b.name)}</span></div>
        ${g.phase === "ended" ? `<div class="row"><span class="k">Result</span><span>${g.winner ? name(g.winner) + " wins" : "Draw"}</span></div>` : ""}
      </div>`;
    }).join("");
  }
  $("log").textContent = logs.join("\n");
  $("log").scrollTop = $("log").scrollHeight;
});

function resetGame(id){ socket.emit("admin_reset", id); }
</script>
</body>
</html>
